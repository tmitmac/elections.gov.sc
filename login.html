<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Staff Login | Square Country Electoral Commission</title>

  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
  <link rel="shortcut icon" href="favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#FF7B25',
            secondary: '#FFA364'
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/feather-icons"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

<custom-navbar></custom-navbar>

<!-- Main Login Area -->
<main class="flex-1">

  <section class="bg-gradient-to-br from-primary to-secondary text-white">
    <div class="max-w-7xl mx-auto px-6 py-16 text-center">

      <div class="flex justify-center mb-5">
        <div class="w-16 h-16 bg-white/15 rounded-2xl flex items-center justify-center">
          <i data-feather="lock" class="w-8 h-8"></i>
        </div>
      </div>

      <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4">
        Staff Login
      </h1>

      <p class="text-lg md:text-xl opacity-95 max-w-2xl mx-auto">
        Sign in to access Electoral Commission staff services.
      </p>

    </div>
  </section>

  <section class="max-w-md mx-auto px-6 py-16">

    <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8">

      <div class="mb-8">
        <h2 class="text-2xl font-bold text-slate-900 mb-2">
          Sign in
        </h2>

        <p class="text-slate-500 text-sm">
          Enter your Electoral Commission staff credentials.
        </p>
      </div>

      <form id="loginForm">

        <!-- Email -->
        <div class="mb-5">

          <label
            for="email"
            class="block text-sm font-semibold text-slate-700 mb-2">
            Staff email
          </label>

          <div class="relative">

            <i
              data-feather="mail"
              class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400">
            </i>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="name@elections.gov.sc"
              autocomplete="username"
              required
              class="w-full border border-slate-300 rounded-lg pl-11 pr-4 py-3 outline-none focus:ring-2 focus:ring-primary focus:border-primary transition"
            />

          </div>

        </div>

        <!-- Password -->
        <div class="mb-5">

          <div class="flex justify-between items-center mb-2">

            <label
              for="password"
              class="block text-sm font-semibold text-slate-700">
              Password
            </label>

            <a
              href="#"
              onclick="return false;"
              class="text-sm text-primary hover:underline">
              Forgot password?
            </a>

          </div>

          <div class="relative">

            <i
              data-feather="key"
              class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400">
            </i>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
              class="w-full border border-slate-300 rounded-lg pl-11 pr-12 py-3 outline-none focus:ring-2 focus:ring-primary focus:border-primary transition"
            />

            <button
              type="button"
              id="togglePassword"
              aria-label="Show password"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">

              <i data-feather="eye" class="w-5 h-5"></i>

            </button>

          </div>

        </div>

        <!-- Remember Me -->
        <div class="flex items-center mb-7">

          <input
            type="checkbox"
            id="remember"
            class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary"
          />

          <label
            for="remember"
            class="ml-2 text-sm text-slate-600">
            Remember me on this device
          </label>

        </div>

        <!-- Login Button -->
        <button
          type="submit"
          id="loginButton"
          class="w-full bg-primary hover:bg-orange-600 text-white font-bold py-3 px-6 rounded-lg shadow-sm transition flex items-center justify-center gap-2">

          <i data-feather="log-in" class="w-5 h-5"></i>

          Sign in

        </button>

      </form>

      <!-- Login Message -->
      <div
        id="loginMessage"
        class="hidden mt-5 p-4 rounded-lg text-sm">
      </div>

    </div>

    <!-- Security Notice -->
    <div class="mt-6 bg-slate-100 border border-slate-200 rounded-xl p-5">

      <div class="flex gap-3">

        <i
          data-feather="shield"
          class="w-5 h-5 text-slate-500 flex-shrink-0 mt-0.5">
        </i>

        <div>

          <h3 class="font-semibold text-slate-700 text-sm mb-1">
            Staff access only
          </h3>

          <p class="text-xs text-slate-500 leading-relaxed">
            This system is restricted to authorised Electoral Commission
            personnel. Unauthorised access or use may be monitored and
            recorded.
          </p>

        </div>

      </div>

    </div>

  </section>

</main>

<custom-footer></custom-footer>

<script src="components/navbar.js"></script>
<script src="components/footer.js"></script>

<script>

  feather.replace();


  /* ============================================================
     STAFF ACCOUNTS
     ============================================================ */

  const staffAccounts = {

    "trent.mckenzie@elections.gov.sc": {
      password: "doc5Tey!",
      name: "Results Administrator",
      role: "Results Administrator"
    },

    "cro@squarevote.gov": {
      password: "SC2026!Returning",
      name: "Chief Returning Officer",
      role: "Chief Returning Officer"
    },

    "operations@squarevote.gov": {
      password: "SC2026!Operations",
      name: "Election Operations",
      role: "Election Operations"
    },

    "results@squarevote.gov": {
      password: "SC2026!Results",
      name: "Results Administrator",
      role: "Results Administrator"
    }

  };


  /* ============================================================
     SHOW / HIDE PASSWORD
     ============================================================ */

  const togglePassword =
    document.getElementById('togglePassword');

  const passwordInput =
    document.getElementById('password');


  togglePassword.addEventListener('click', () => {

    const isPassword =
      passwordInput.type === 'password';

    passwordInput.type =
      isPassword ? 'text' : 'password';

    togglePassword.innerHTML =
      isPassword
        ? '<i data-feather="eye-off" class="w-5 h-5"></i>'
        : '<i data-feather="eye" class="w-5 h-5"></i>';

    feather.replace();

    togglePassword.setAttribute(
      'aria-label',
      isPassword ? 'Hide password' : 'Show password'
    );

  });


  /* ============================================================
     LOGIN
     ============================================================ */

  document
    .getElementById('loginForm')
    .addEventListener('submit', function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById('email')
          .value
          .trim()
          .toLowerCase();


      const password =
        document.getElementById('password').value;


      const remember =
        document.getElementById('remember').checked;


      const message =
        document.getElementById('loginMessage');


      const button =
        document.getElementById('loginButton');


      /* Find account */

      const account =
        staffAccounts[email];


      /* Incorrect login */

      if (!account || account.password !== password) {

        message.className =
          'mt-5 p-4 rounded-lg text-sm bg-red-50 border border-red-200 text-red-800';

        message.textContent =
          'Incorrect staff email or password.';

        return;

      }


      /* ========================================================
         CREATE LOGIN SESSION
         ======================================================== */

      const session = {

        email: email,

        name: account.name,

        role: account.role,

        loggedIn: true,

        loginTime: new Date().toISOString()

      };


      const sessionData =
        JSON.stringify(session);


      /* Remember me */

      if (remember) {

        localStorage.setItem(
          'squareCountryStaffSession',
          sessionData
        );

        sessionStorage.removeItem(
          'squareCountryStaffSession'
        );

      }

      else {

        sessionStorage.setItem(
          'squareCountryStaffSession',
          sessionData
        );

        localStorage.removeItem(
          'squareCountryStaffSession'
        );

      }


      /* ========================================================
         SUCCESS MESSAGE
         ======================================================== */

      message.className =
        'mt-5 p-4 rounded-lg text-sm bg-green-50 border border-green-200 text-green-800';

      message.textContent =
        'Sign in successful. Redirecting...';


      button.disabled = true;

      button.classList.add(
        'opacity-75',
        'cursor-not-allowed'
      );


      /* Redirect */

      setTimeout(() => {

        window.location.href =
          'staff.html';

      }, 700);

    });

</script>

</body>
</html>
